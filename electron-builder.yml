appId: io.modelgraph.desktop
productName: Model Graph
icon: desktop/icon.png
directories:
  app: desktop-app
  output: release
files:
  - main.cjs
  - protocol.cjs
  - preload.cjs
  - ai.cjs
  - ai-ipc.cjs
  - stories.cjs
  - repo-analysis.cjs
  - report-store.cjs
  - views.cjs
  - generate-views.cjs
  - diagram-parser.cjs
  - renderer/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - zip
    - dmg
win:
  target:
    - nsis
linux:
  category: Development
  target:
    - AppImage
artifactName: 'Model-Graph-${version}-${os}-${arch}.${ext}'
